name: hub
on:
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
{{pages_permissions}}concurrency:
  group: hub
  cancel-in-progress: false
jobs:
  hub:
    runs-on: ubuntu-latest
{{environment}}    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gleanyard~=0.13.0"
      - name: Check the setup
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: gleanyard hub check || true
      - name: Read the projects and sync alert issues
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: gleanyard hub run --hub-repo "${{ github.repository }}"
      - run: gleanyard hub build --title "{{hub}}"
      - name: Show the overview on the run's summary page
        run: cat site/summary.md >> "$GITHUB_STEP_SUMMARY"
{{publish}}
