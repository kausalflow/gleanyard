[project]
name = "gleanyard"
version = "0.0.1"
description = "Collect structured data from recurring web sources into a schema you define."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KausalFlow" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/kausalflow/gleanyard"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
