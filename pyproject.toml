[project]
name = "gleanyard"
version = "0.14.0"
description = "Collect structured data from recurring web sources into a schema you define."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KausalFlow" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "cssselect>=1.2,<2",
    "icalendar>=6,<8",
    "lxml>=5,<7",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "recurring-ical-events>=3.3,<4",
    "typer>=0.12,<1",
]
keywords = [
    "web-scraping", "data-collection", "etl", "schema", "rss", "icalendar", "json-ld",
    "mcp", "claude-code", "ai-agents", "github-actions", "open-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
gleanyard = "gleanyard.cli:app"

[project.urls]
Homepage = "https://kausalflow.github.io/gleanyard/"
Documentation = "https://kausalflow.github.io/gleanyard/"
Repository = "https://github.com/kausalflow/gleanyard"
Issues = "https://github.com/kausalflow/gleanyard/issues"
Template = "https://github.com/kausalflow/gleanyard-template"

[project.optional-dependencies]
llm = ["pydantic-ai>=1"]
pdf = ["pypdf>=5"]
map = ["crawl4ai>=0.7"]
mcp = ["mcp>=2,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pydantic-ai-slim>=1", "pypdf>=5", "mcp>=2,<3"]
docs = ["zensical"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
