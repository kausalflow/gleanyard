[project]
name = "gleanyard"
version = "0.3.0"
description = "Collect structured data from recurring web sources into a schema you define."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KausalFlow" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "cssselect>=1.2,<2",
    "icalendar>=6,<8",
    "lxml>=5,<7",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "recurring-ical-events>=3.3,<4",
    "typer>=0.12,<1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
gleanyard = "gleanyard.cli:app"

[project.urls]
Repository = "https://github.com/kausalflow/gleanyard"

[project.optional-dependencies]
llm = ["pydantic-ai>=1"]
pdf = ["pypdf>=5"]
map = ["crawl4ai>=0.7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pydantic-ai-slim>=1", "pypdf>=5"]
docs = ["zensical"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
